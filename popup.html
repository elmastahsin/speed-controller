<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Speed Controller</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <button id="toggle" class="toggle">Bu sekmede aç</button>

    <section class="speed">
      <button id="down" class="round" title="Yavaşlat" data-speed-control>−</button>
      <output id="speed">—</output>
      <button id="up" class="round" title="Hızlandır" data-speed-control>+</button>
    </section>

    <p id="status" class="status" hidden></p>

    <section id="presets" class="presets"></section>
    <button id="reset" class="reset" data-speed-control>1.00x'e sıfırla</button>

    <details>
      <summary>Ayarlar</summary>
      <form id="settings" class="settings">
        <label>
          Adım
          <input id="step" name="step" type="number" min="0.05" max="1" step="0.05" />
        </label>
        <label>
          Tercih edilen hız (G)
          <input id="preferredSpeed" name="preferredSpeed" type="number" min="0.1" max="16" step="0.05" />
        </label>
        <label class="check">
          <input id="rememberSpeed" name="rememberSpeed" type="checkbox" />
          Açınca son kullanılan hızla başla
        </label>
        <label class="check">
          <input id="showOverlay" name="showOverlay" type="checkbox" />
          Video üstünde hızı göster
        </label>
      </form>
    </details>

    <details>
      <summary>Kısayollar</summary>
      <dl class="shortcuts">
        <dt>S</dt><dd>Yavaşlat</dd>
        <dt>D</dt><dd>Hızlandır</dd>
        <dt>R</dt><dd>1.00x'e sıfırla</dd>
        <dt>G</dt><dd>1.00x ↔ tercih edilen hız</dd>
        <dt>Z</dt><dd>10 sn geri</dd>
        <dt>X</dt><dd>10 sn ileri</dd>
        <dt>V</dt><dd>Hız göstergesini aç/kapat</dd>
      </dl>
      <p class="note">Kısayollar yalnızca açtığın sekmede çalışır.</p>
    </details>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
